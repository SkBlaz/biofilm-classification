name: Docker Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  docker-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      run: |
        echo "Building Docker image..."
        docker compose build --no-cache
        
    - name: Verify Docker image was built
      run: |
        echo "Verifying Docker image exists..."
        docker images jsi/imagine:latest
        echo "SUCCESS: Docker image built successfully!"

    - name: Create test results directory
      run: |
        mkdir -p examples/test_images_results
        
    - name: Run feature generation test
      timeout-minutes: 15
      run: |
        echo "Running feature generation test..."
        docker compose run --rm imagine-test-generate-features
        echo "SUCCESS: Feature generation test completed!"
        
    - name: Run learning benchmark test
      timeout-minutes: 15
      run: |
        echo "Running learning benchmark test..."
        docker compose run --rm imagine-test-learning-benchmark
        echo "SUCCESS: Learning benchmark test completed!"
        
    - name: Run data visualization test
      timeout-minutes: 15
      run: |
        echo "Running data visualization test..."
        docker compose run --rm imagine-test-data-visualization
        echo "SUCCESS: Data visualization test completed!"
        
    - name: Run learning benchmark with model saving test
      timeout-minutes: 15
      run: |
        echo "Running learning benchmark with model saving test..."
        docker compose run --rm imagine-test-learning-benchmark-save-models
        echo "SUCCESS: Learning benchmark with model saving test completed!"
        
    - name: Verify models were saved
      run: |
        echo "Checking if models were saved..."
        if [ -d "examples/test_images_results/models" ] && [ "$(ls -A examples/test_images_results/models)" ]; then
          echo "SUCCESS: Models directory contains files"
          ls -la examples/test_images_results/models/
        else
          echo "ERROR: Models directory is empty or doesn't exist"
          exit 1
        fi
        
    - name: Run inference test
      timeout-minutes: 15
      run: |
        echo "Running inference test..."
        docker compose run --rm imagine-test-inference
        echo "SUCCESS: Inference test completed!"
        
    - name: Verify inference results were generated
      run: |
        echo "Checking if inference results were generated..."
        if [ -d "examples/test_images_results/inference_output" ] && [ "$(ls -A examples/test_images_results/inference_output)" ]; then
          echo "SUCCESS: Inference results directory contains files"
          ls -la examples/test_images_results/inference_output/
        else
          echo "ERROR: Inference results directory is empty or doesn't exist"
          exit 1
        fi
        
    - name: Run inference test with environment variables
      timeout-minutes: 15
      run: |
        echo "Running inference test with environment variables..."
        docker compose run --rm imagine-test-inference-env
        echo "SUCCESS: Inference test with environment variables completed!"
        
    - name: Verify environment variable inference results were generated
      run: |
        echo "Checking if environment variable inference results were generated..."
        if [ -d "examples/test_images_results/inference_output_env" ] && [ "$(ls -A examples/test_images_results/inference_output_env)" ]; then
          echo "SUCCESS: Environment variable inference results directory contains files"
          ls -la examples/test_images_results/inference_output_env/
        else
          echo "ERROR: Environment variable inference results directory is empty or doesn't exist"
          exit 1
        fi
        
    - name: Verify test results were generated
      run: |
        echo "Checking if test results were generated..."
        if [ -d "examples/test_images_results" ] && [ "$(ls -A examples/test_images_results)" ]; then
          echo "SUCCESS: Test results directory is not empty"
          ls -la examples/test_images_results/
        else
          echo "WARNING: Test results directory is empty or doesn't exist"
          exit 1
        fi
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: examples/test_images_results/
        retention-days: 30